<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naveya — v2 Prototype (Login → Shell → all routes)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Anek+Latin:wght@400;500;600;700&family=Anek+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #1A1210; }
    #root { height: 100vh; }
    * { box-sizing: border-box; }
    /* The theme-accurate :focus-visible ring is injected by kit.jsx's
       ThemeProvider (reads window.G2 live, light+dark parity) — not
       hardcoded here. */
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    /* Force the CLASSIC JSX runtime so JSX compiles to React.createElement
       (uses the global React UMD) — no ESM import injection, no build step. */
    Babel.registerPreset("tenure", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- code-as-design: tokens → kit → shell → pages → prototype harness, transpiled in-browser -->
  <script type="text/babel" data-presets="tenure" src="v2/tokens.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/kit.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/screens.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/shell.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/dashboard.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/attendance.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/leave.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/payslips.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/docsprofile.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/pages/substitution.jsx"></script>
  <script type="text/babel" data-presets="tenure" src="v2/prototype.jsx"></script>
  <script type="text/babel" data-presets="tenure">
    /* @jsxRuntime classic */
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.Prototype2));
  </script>
</body>
</html>
