  <script>
    /* Deep-link contract: ?screen=login|home|attendance|leave|payslips|documents|profile · ?theme=light|dark
       URL params win over localStorage and are NOT persisted, so variant
       screenshots are deterministic. */
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem("naveya-theme");
      } catch (e) { /* storage unavailable */ }
      var p = new URLSearchParams(location.search);
      if (p.get("theme")) theme = p.get("theme");
      /* LIGHT IS THE DEFAULT. Staffroom Terracotta is a light-first palette
         (cream page #FAF3EA, white cards) and a teacher opens this on a school
         desktop in daylight — so we do NOT follow prefers-color-scheme. Dark
         (warm espresso) stays available via the toggle, ?theme=dark, or a
         stored preference. */
      if (theme !== "dark" && theme !== "light") theme = "light";
      document.documentElement.dataset.theme = theme;
      window.NAVEYA_BOOT = {
        theme: theme,
        role: p.get("role") || "employee",
        /* the screen key is validated against the role's own rail at mount,
           so a stale ?screen= from another role falls back to that role's home */
        screen: p.get("screen") || null
      };
      document.documentElement.style.background = theme === "dark" ? "#1D1410" : "#FAF3EA";
    })();
  </script>

  <!-- ============================================================
       THE FOUR CANDIDATES.

       `fallbacks` is appended to every chain, and ENDS in Hind: Red
       Hat Mono, Roboto Mono, IBM Plex Mono and JetBrains Mono all
       lack the rupee sign, so Hind is what actually draws it.

       `G3.font` is rewritten IN PLACE rather than replaced, because
       G3.t() closes over the object and reads the family at call
       time — which is why a switch re-renders rather than reloads.
       ============================================================ -->
  <script>
    window.NAVEYA_TYPE = {
      fallbacks: "system-ui, -apple-system, 'Segoe UI', sans-serif",
      /* the figure chain. It is no longer a monospace — what lines a
         money column up is tabular lining figures, which G3.fig() asks
         for by name. Hind still ends it: it draws the rupee sign. */
      monoFall: "'Hind', system-ui, sans-serif",
      sets: [
        {
          key: "inter", name: "Current — Inter + Roboto",
          note: "What the dashboard uses today. The most neutral words here, with Roboto for the figures — narrower numerals and a different one and four, so money reads as its own thing without a typewriter.",
          display: "'Inter'", ui: "'Inter'", mono: "'Roboto'",
          words: "Inter", figures: "Roboto",
        },
        {
          key: "figtree", name: "Figtree + IBM Plex Sans",
          note: "Rounder, warmer words, against Plex's characterful numerals — a one with a foot and a flat-topped four. The widest difference between the two faces on this list.",
          display: "'Figtree'", ui: "'Figtree'", mono: "'IBM Plex Sans'",
          words: "Figtree", figures: "IBM Plex Sans",
        },
        {
          key: "public", name: "Public Sans + Archivo",
          note: "Words drawn for government forms, figures squarer and a shade wider. Reads like a form that was printed rather than typed.",
          display: "'Public Sans'", ui: "'Public Sans'", mono: "'Archivo'",
          words: "Public Sans", figures: "Archivo",
        },
        {
          key: "space", name: "Space Grotesk + Barlow",
          note: "The most character in the headings, with Barlow's narrow even numerals underneath — the quietest money of the four, which long salary columns want.",
          display: "'Space Grotesk'", ui: "'Space Grotesk'", mono: "'Barlow'",
          words: "Space Grotesk", figures: "Barlow",
        },
        {
          key: "staffroom", name: "Previous",
          note: "What the dashboard used before 12 October, for comparison: Bricolage Grotesque headings over Hanken Grotesk, figures in Red Hat Mono.",
          display: "'Bricolage Grotesque'", ui: "'Hanken Grotesk'", mono: "'Red Hat Mono'",
          words: "Bricolage + Hanken", figures: "Red Hat Mono",
        },
      ],
    };

    window.NAVEYA_SET_TYPE = function (key) {
      var T = window.NAVEYA_TYPE;
      var set = T.sets.filter(function (s) { return s.key === key; })[0] || T.sets[0];
      var G = window.G3;
      if (!G || !G.font) return set;
      /* rewritten in place: G3.t() reads these at call time */
      G.font.display = set.display + ", " + set.ui + ", 'Hind', " + T.fallbacks;
      G.font.ui = set.ui + ", 'Hind', " + T.fallbacks;
      G.font.mono = set.mono + ", " + T.monoFall;
      try { localStorage.setItem("naveya-type", key); } catch (e) { /* storage unavailable */ }
      window.NAVEYA_TYPE.current = set;
      if (window.NAVEYA_TYPE.onChange) window.NAVEYA_TYPE.onChange(set);
      return set;
    };
  </script>

  <script type="text/babel" data-presets="tenure">
    /* @jsxRuntime classic */
    function NaveyaV3() {
      const boot = window.NAVEYA_BOOT;
      const { ThemeProvider, LangProvider, Rail, EmptyState, navItemsFor, ROLES } = window.UI3;
      const { Login, Home } = window.Screens3;
      const P = window.Pages3 || {};

      /* Flat table: screen keys are globally unique across roles. A key with
         no component yet renders NotBuilt, so every rail item is reachable
         and the gaps are visible rather than silently dead. */
      const ROUTES = {
        home: Home,
        attendance: P.Attendance, leave: P.Leave, payslips: P.Payslips,
        documents: P.Documents, profile: P.Profile,
        dhHome: P.DHHome, dhLeave: P.DHLeave, dhAttendance: P.DHAttendance,
        prHome: P.PRHome, prAttendance: P.PRAttendance, prLeave: P.PRLeave,
        drHome: P.DRHome, drCampus: P.DRCampus, drLeave: P.DRLeave,
        hrHome: P.HRHome, hrStaff: P.HRStaff, hrDocs: P.HRDocs,
        hrCompliance: P.HRCompliance, hrLogins: P.HRLogins, hrHiring: P.HRHiring, hrOffers: P.HROffers,
        hrLifecycle: P.HRLifecycle, hrLeaveAtt: P.HRLeaveAtt, hrAttendance: P.HRAttendance, hrHelp: P.HRHelp,
        hrPay: P.HRPay,
        hrReports: P.HRReports,
        /* detail routes — reachable from a screen, deliberately NOT rail items
           (alfred's rule: ~40% of screens are tasks/details and must never
           become nav) */
        hrRecord: P.HRRecord, hrAdd: P.HRAdd,
        empTasks: P.EmpTasks, empMore: P.EmpMore,
        /* pySalary / pyOps are RETIRED as rail items (2026-10-07) but stay
           URL-reachable so the old module can be compared against the new
           split; pages/py-shelf.jsx composes their screens. */
        pySalary: P.PYSalary, pyOps: P.PYOps, gaSystems: P.GASystems,
        pyAdjust: P.PYAdjust, pyExits: P.PYExits, pyRules: P.PYRules, pyReports: P.PYReports,
        pyPeople: P.PYPeople, pyRecord: P.PYRecord,
        /* PUB — the only screens with no authenticated user and no rail;
           reachable by URL only (?screen=public), never a nav item */
        public: P.Public,
        pyHome: P.PYHome, pyRun: P.PYRun, pyPaidDays: P.PYPaidDays,
        acHome: P.ACHome, acGate: P.ACGate, acLiability: P.ACLiability,
        acFilings: P.ACFilings, acFile: P.ACFile, acContrib: P.ACContrib, acDecl: P.ACDecl, acBonus: P.ACBonus, acReports: P.ACReports,
        gaHome: P.GAHome, gaUsers: P.GAUsers, gaAudit: P.GAAudit,
      };
      /* screen key -> the inventory code it implements, so an unbuilt screen
         can name itself honestly instead of saying "coming soon" */
      const CODES = {
        dhHome: "DH-01", dhLeave: "DH-02", dhAttendance: "DH-03",
        prHome: "PR-01", prAttendance: "PR-02", prLeave: "PR-03",
        drHome: "DR-01", drCampus: "DR-03", drLeave: "DR-02",
        hrHome: "HR-01", hrStaff: "HR-02", hrDocs: "HR-09/10/11/12",
        hrRecord: "HR-03", hrAdd: "HR-02a", hrLogins: "HR-38", hrAttendance: "HR-39", hrCompliance: "HR-09/10/11/12", hrHiring: "HR-13/14/16/17",
        empTasks: "EMP-03/04/06/11/12/13", empMore: "EMP-08/09/14/15/16/17/19",
        pySalary: "PY-02/03/04/05/06", pyOps: "PY-09..PY-18", gaSystems: "GA-02/03/05/06/07/09/10/11/12",
        pyPeople: "PY-05/06", pyRecord: "PY-05 detail", pyAdjust: "PY-13/14/15", pyExits: "PY-16/17",
        pyRules: "PY-02/03/04", pyReports: "PY-18",
        hrOffers: "HR-15/18/19/20/21", hrLifecycle: "HR-22/23/24/25",
        hrLeaveAtt: "HR-26/27/28/29/30", hrPay: "HR-40/41", hrHelp: "HR-31/32/33",
        hrReports: "HR-08/34/35/36/37",
        pyHome: "PY-01", pyRun: "PY-07", pyPaidDays: "PY-08",
        acHome: "AC-01", acGate: "AC-02", acLiability: "AC-03",
        acFilings: "AC-04", acFile: "AC-05", acContrib: "AC-08", acDecl: "AC-07", acBonus: "AC-06", acReports: "AC-09",
        gaHome: "GA-01", gaUsers: "GA-04", gaAudit: "GA-08",
        public: "PUB-01/03/04",
      };

      function NotBuilt({ role, active, onNavigate, label }) {
        /* G3 has no `.color` level — the palettes are G3.light / G3.dark.
           Reading the theme is right anyway: a placeholder that ignored
           dark mode would be the one screen that flashes white. */
        const { c } = window.UI3.useTheme();
        return (
          <div style={{ display: "flex", minHeight: "100vh", background: c.page }}>
            <Rail role={role} active={active} onNavigate={onNavigate} initials="AR" />
            <main style={{ flex: 1, display: "grid", placeItems: "center", padding: 40 }}>
              <EmptyState
                head={(label || active) + " — not built yet"}
                body={"This screen is " + (CODES[active] || active) + " in docs/screen-inventory.md. Its rail slot and route are wired, so it is reachable the moment it is built."}
              />
            </main>
          </div>
        );
      }

      function RoleSwitch({ role, onRole }) {
        return (
          /* z-index 1800, BELOW drawers and dialogs (2000) and toasts
             (3000). At 9000 it sat on top of the primary button of every
             side drawer, so a click meant for "Continue" switched role. */
          <div style={{ position: "fixed", right: 14, bottom: 14, zIndex: 1800, display: "flex", gap: 4,
                        background: "rgba(255,255,255,.94)", border: "1px solid rgba(0,0,0,.12)",
                        borderRadius: 999, padding: 4, boxShadow: "0 6px 20px -6px rgba(0,0,0,.28)",
                        fontFamily: "system-ui, sans-serif", fontSize: 11 }}>
            {ROLES.map((r) => (
              <button key={r} type="button" onClick={() => onRole(r)}
                style={{ border: 0, cursor: "pointer", borderRadius: 999, padding: "8px 11px",
                         background: r === role ? "#3E2A1F" : "transparent",
                         color: r === role ? "#F6E9DC" : "#3E2A1F", fontWeight: r === role ? 700 : 500 }}>
                {r}
              </button>
            ))}
          </div>
        );
      }

      function Shell() {
        const boot = window.NAVEYA_BOOT;
        const [role, setRole] = React.useState(boot.role);
        const nav = navItemsFor(role);
        const firstKey = nav.length ? nav[0].key : "home";
        /* a key is valid if the role's rail has it OR it is a routable
           detail reached from one of that role's screens */
        const valid = (r, k) => navItemsFor(r).some((it) => it.key === k) || !!ROUTES[k];
        const [screen, setScreen] = React.useState(
          boot.screen === "login" || (boot.screen && valid(boot.role, boot.screen)) ? boot.screen : firstKey
        );
        function pickRole(r) {
          setRole(r);
          const n = navItemsFor(r);
          setScreen(n.length ? n[0].key : "home");
        }
        const Screen = ROUTES[screen];
        const label = (nav.find((it) => it.key === screen) || {}).label;
        return (
          <React.Fragment>
            {screen === "login"
              ? <Login onSignIn={() => setScreen(firstKey)} />
              : Screen
                ? <Screen role={role} onNavigate={(k) => setScreen(k)} />
                : <NotBuilt role={role} active={screen} onNavigate={(k) => setScreen(k)}
                            label={label ? window.UI3.t(label) : screen} />}
            <RoleSwitch role={role} onRole={pickRole} />
          </React.Fragment>
        );
      }

      return (
        <ThemeProvider initialMode={boot.theme}>
          <LangProvider>
            <Shell />
          </LangProvider>
        </ThemeProvider>
      );
    }
    /* ============================================================
       THE SWITCHER. It sits at the foot, out of the way of the screen
       being judged, and it names what each set changes rather than
       just listing three families — the question is how the product
       reads, not which fonts are loaded.
       ============================================================ */
    function TypeBar({ value, onChange }) {
      const T = window.NAVEYA_TYPE;
      const set = T.sets.filter(function (s) { return s.key === value; })[0] || T.sets[0];
      return (
        <div style={{
          position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 1900,
          background: "rgba(255,255,255,.96)", borderTop: "1px solid rgba(0,0,0,.14)",
          boxShadow: "0 -8px 24px -14px rgba(0,0,0,.35)",
          padding: "9px 16px", display: "flex", alignItems: "center", gap: 14,
          flexWrap: "wrap", fontFamily: "system-ui, sans-serif", fontSize: 12.5, color: "#3E2A1F",
        }}>
          <span style={{ fontWeight: 700, letterSpacing: ".04em", textTransform: "uppercase", fontSize: 10.5, opacity: .65 }}>
            Typeface
          </span>
          <div role="group" aria-label="Typeface" style={{ display: "inline-flex", gap: 4, background: "rgba(0,0,0,.05)", borderRadius: 999, padding: 3 }}>
            {T.sets.map(function (s) {
              const on = s.key === value;
              return (
                <button
                  key={s.key} type="button" aria-pressed={on ? "true" : "false"}
                  onClick={function () { onChange(s.key); }}
                  style={{
                    border: 0, cursor: "pointer", borderRadius: 999, padding: "7px 13px",
                    background: on ? "#3E2A1F" : "transparent",
                    color: on ? "#F6E9DC" : "#3E2A1F", fontWeight: on ? 700 : 500, fontSize: 12.5,
                  }}
                >
                  {s.name}
                </button>
              );
            })}
          </div>
          <span style={{ opacity: .75, flex: "1 1 300px", minWidth: 0, lineHeight: 1.45 }}>{set.note}</span>
          <span style={{ display: "inline-flex", alignItems: "baseline", gap: 10, flexShrink: 0 }}>
            <span style={{ opacity: .55, fontSize: 10.5, textTransform: "uppercase", letterSpacing: ".04em", fontWeight: 700 }}>
              {set.words} <span style={{ opacity: .5 }}>·</span> {set.figures}
            </span>
            <span style={{ fontFamily: window.G3.font.mono, fontVariantNumeric: "tabular-nums lining-nums", fontWeight: 600, fontSize: 14 }}>
              ₹ 2,54,93,750.00
            </span>
          </span>
        </div>
      );
    }

    /* The choice is applied DURING render, not in an effect: every
       screen below reads G3.font at call time, so the family has to be
       in place before they render. `key` remounts the tree, which is
       what makes a switch take effect without a reload. */
    function TypeApp() {
      const [key, setKey] = React.useState(function () {
        let stored = null;
        try { stored = localStorage.getItem("naveya-type"); } catch (e) { /* storage unavailable */ }
        const asked = new URLSearchParams(location.search).get("type");
        const want = asked || stored;
        return window.NAVEYA_TYPE.sets.some(function (s) { return s.key === want; })
          ? want : window.NAVEYA_TYPE.sets[0].key;
      });
      window.NAVEYA_SET_TYPE(key);
      return (
        <React.Fragment>
          <NaveyaV3 key={key} />
          <TypeBar value={key} onChange={setKey} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TypeApp />);
  </script>
</body>
</html>
